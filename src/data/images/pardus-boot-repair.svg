<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg_gradient" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="border_gradient" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3A86FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF9E00" stop-opacity="0.7"/>
    </linearGradient>
    
    <!-- Accent Gear Gradient (Pars Cyan/Blue) -->
    <linearGradient id="gear_gradient" x1="18" y1="12" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Wrench Gradient (Pars Amber/Gold) -->
    <linearGradient id="wrench_gradient" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>

    <!-- Shield / Base Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00D2FF" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow_deep" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container with ParsLinux Dark Aesthetics -->
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#bg_gradient)" filter="url(#shadow_deep)"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="13.5" stroke="url(#border_gradient)" stroke-width="1.2"/>

  <!-- Subtitle Grid/Circuit Lines (High-tech recovery vibe) -->
  <path d="M12 48L24 48L28 44L52 44" stroke="#2A323D" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="52" cy="44" r="1.5" fill="#00D2FF"/>
  <circle cx="12" cy="48" r="1.5" fill="#FF9E00"/>

  <!-- Gear (Boot / Engine Symbol) -->
  <g transform="translate(18, 10) scale(0.65)" filter="url(#glow)">
    <path d="M21 2C10.5 2 2 10.5 2 21C2 31.5 10.5 40 21 40C31.5 40 40 31.5 40 21C40 10.5 31.5 2 21 2ZM21 8C28.2 8 34 13.8 34 21C34 28.2 28.2 34 21 34C13.8 34 8 28.2 8 21C8 13.8 13.8 8 21 8Z" fill="url(#gear_gradient)" opacity="0.2"/>
    <!-- Outer Gear Teeth -->
    <path d="M24 1.5H18L18.8 6.2C17.2 6.8 15.7 7.7 14.4 8.8L10 6.9L7 12L10.7 15C10.2 16.6 10 18.3 10 20C10 21.7 10.2 23.4 10.7 25L7 28L10 33.1L14.4 31.2C15.7 32.3 17.2 33.2 18.8 33.8L18 38.5H24L23.2 33.8C24.8 33.2 26.3 32.3 27.6 31.2L32 33.1L35 28L31.3 25C31.8 23.4 32 21.7 32 20C32 18.3 31.8 16.6 31.3 15L35 12L32 6.9L27.6 8.8C26.3 7.7 24.8 6.8 23.2 6.2L24 1.5ZM21 13C24.9 13 28 16.1 28 20C28 23.9 24.9 27 21 27C17.1 27 14 23.9 14 20C14 16.1 17.1 13 21 13Z" fill="url(#gear_gradient)"/>
  </g>

  <!-- Crossed Recovery Wrench / Screwdriver (Repair Symbol) -->
  <g transform="translate(11, 14)">
    <!-- Diagonal Wrench -->
    <path d="M7.4 6.2C6.1 7.5 5.8 9.5 6.6 11.1L2.2 28.5C1.8 30.1 2.8 31.7 4.4 32.1C6.0 32.5 7.6 31.5 8.0 29.9L12.4 12.5C14.0 13.3 16.0 13.0 17.3 11.7C18.9 10.1 19.1 7.7 17.9 5.8L14.7 9.0L11.5 8.2L10.7 5.0L13.9 1.8C12.0 0.6 9.6 0.8 8.0 2.4L7.4 6.2Z" 
          fill="url(#wrench_gradient)" filter="url(#shadow_deep)"/>
    <!-- Small bolt on wrench head -->
    <circle cx="5.2" cy="30.2" r="1.3" fill="#1E232A"/>
  </g>

  <!-- Power / Boot Indicator Light (Emerald Green / Active) -->
  <circle cx="48" cy="16" r="3" fill="#10B981" filter="url(#glow)"/>
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF"/>
</svg>
